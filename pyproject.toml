[project]
name = "failecho-server"
version = "0.1.0"
description = "Live failure intelligence for autonomous software. Before your agent retries, check what happened to everyone else."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "uvicorn[standard]>=0.30",
    "mcp>=2.0",
    "opentelemetry-proto>=1.20",
]

[project.scripts]
# A local stdio MCP server that relays to the shared network. It stores
# nothing; see failecho_mcp/__init__.py.
failecho-mcp = "failecho_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# The bundled client depends on nothing but the standard library.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "failecho_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
