<svg xmlns="http://www.w3.org/2000/svg" width="56" height="1200"
     viewBox="0 0 56 1200">
<!-- A waveform read down the page: two sines of unequal period on one axis,
     each filled back to that axis, so the lobes overlap and deepen where the
     curves cross. The sides carry different periods on purpose; an echo does
     not come back symmetrical. Colour lives here, not in a CSS mask, because
     a mask a browser declines to apply would leave a coloured bar behind. -->
<defs>
  <linearGradient id="b" x1="0" x2="56" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f83030" stop-opacity=".34"/>
    <stop offset=".55" stop-color="#f83030" stop-opacity=".16"/>
    <stop offset="1" stop-color="#f83030" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="e" x1="0" x2="56" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f83030" stop-opacity=".62"/>
    <stop offset=".5" stop-color="#f83030" stop-opacity=".3"/>
    <stop offset="1" stop-color="#f83030" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="a" x1="0" x2="56" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f83030" stop-opacity=".3"/>
    <stop offset="1" stop-color="#f83030" stop-opacity=".12"/>
  </linearGradient>
</defs>
