<svg xmlns="http://www.w3.org/2000/svg" width="56" height="1200"
     viewBox="0 0 56 1200">
<!-- Two sines of unequal period sharing a centre line, each filled back to
     the page edge so the strip reads as a waveform rather than a pair of
     threads. The two bodies overlap and deepen where they cross. The sides
     carry different periods on purpose: an echo does not come back
     symmetrical. Colour lives here, not in a CSS mask &#8212; a mask a browser
     declines to apply would leave a coloured bar. -->
<defs>
  <linearGradient id="b" x1="56" x2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f83030" stop-opacity=".13"/>
    <stop offset=".5" stop-color="#f83030" stop-opacity=".05"/>
    <stop offset="1" stop-color="#f83030" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="e" x1="56" x2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f83030" stop-opacity=".3"/>
    <stop offset=".35" stop-color="#f83030" stop-opacity=".12"/>
    <stop offset="1" stop-color="#f83030" stop-opacity="0"/>
  </linearGradient>
</defs>
